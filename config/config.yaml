# ==========================================================
#  DEEPSEEK-AGENT - Main Configuration
#  Autonomous multi-agent CLI system (Termux friendly)
# ==========================================================

app:
  name: "DeepSeek-Agent"
  version: "2.0.0"
  workspace: "./workspace"          # agent ka sandbox / project directory
  data_dir: "./.deepseek"              # db, vectors, logs, sessions
  theme: "cocoa"                    # cyber | mono | matrix
  language: "auto"                  # auto | en | hi  (agent reply language)

# ----------------------------------------------------------
# PROVIDERS  -> add new providers here (openai/groq/etc.)
# ----------------------------------------------------------
# Folder for API keys — the /key menu saves here (gitignored, chmod 600)
keys:
  dir: "./keys"

providers:
  default: deepseek

  deepseek:
    enabled: true
    type: deepseek                   # deepseek_agent/providers/deepseek.py
    # DeepSeek-Agent logs in with email+password -> bearer token
    # (saved to keys/deepseek_account.json + keys/deepseek_token, chmod 600).
    # Native app mode: instant | expert | vision.
    # Default is AUTO — the agent picks the mode per task (instant for
    # chat/math, expert for coding, vision for images). Pin with `/mode`.
    mode: expert
    thinking: true
    search: false
    keys_dir: "./keys"
    data_dir: "./.deepseek"
    timeout: 180

  openai:
    enabled: false
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    env_keys: ["OPENAI_API_KEY"]
    timeout: 180

  groq:
    enabled: false
    type: openai_compatible
    base_url: "https://api.groq.com/openai/v1"
    env_keys: ["GROQ_API_KEY"]
    timeout: 120

  ollama:
    enabled: false
    type: openai_compatible
    base_url: "http://127.0.0.1:11434/v1"
    env_keys: []
    api_key: "ollama"
    timeout: 300

# ----------------------------------------------------------
# MODEL ROLES  (role -> model + fallback chain)
# ----------------------------------------------------------
# DeepSeek-Agent: every role runs on DeepSeek (native instant/expert/vision mode
# is chosen globally with `/mode`; the model name is a placeholder — DeepSeek
# uses its own web API and ignores it).
models:
  supervisor:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 4096
  router:
    model: deepseek-chat
    fallback: []
    temperature: 0.0
    max_tokens: 1024
  worker:
    model: deepseek-chat
    fallback: []
    temperature: 0.4
    max_tokens: 4096
  solo:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 8192
  researcher:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 8192
  coder_quick:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  coder_repo:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  critic:
    model: deepseek-chat
    fallback: []
    temperature: 0.1
    max_tokens: 4096
  hard_fallback:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  embed:
    model: deepseek-chat
    fallback: []
  code_embed:
    model: deepseek-chat
    fallback: []
  ocr:
    model: deepseek-chat
    fallback: []
  safety:
    model: deepseek-chat
    fallback: []
  vision:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 2048

# ----------------------------------------------------------
# RATE LIMITS  (requests per second per model)
# DeepSeek-Agent talks to chat.deepseek.com's web API (email+password login,
# native instant/expert/vision modes). The DeepSeek provider paces itself;
# this table is a light client-side throttle only. Model names are placeholders.
# ----------------------------------------------------------
rate_limits:
  deepseek-chat: 0.8
  default: 1.5

# ----------------------------------------------------------
# AUTONOMY CONTROLS
# ----------------------------------------------------------
autonomy:
  max_subagents: 5
  max_parallel_agents: 3
  max_task_depth: 3
  max_steps_per_agent: 12
  max_retries: 2
  task_timeout_seconds: 180
  overall_timeout_seconds: 1500
  large_model_calls_per_task: 1
  auto_continue: true            # agent bina puche next step chalata rahe
  reflection_every: 4            # har N steps par self-reflection

# ----------------------------------------------------------
# SAFETY / APPROVALS
# ----------------------------------------------------------
safety:
  moderation_enabled: true
  moderate_user_input: true
  moderate_final_output: true
  approval_mode: "smart"        # smart | always | never(yolo)
  human_approval_required:
    - delete_files
    - deploy_production
    - send_email
    - publish_content
    - financial_action
    - account_change
    - shell_dangerous
  shell:
    allow_network: true
    blocked_patterns:
      - "rm -rf /"
      - "mkfs"
      - ":(){:|:&};:"
      - "dd if=/dev/zero"
      - "chmod -R 777 /"
      - "> /dev/sda"
    timeout: 120
  sandbox_root_only: true       # writes stay inside the workspace only

# ----------------------------------------------------------
# RAG
# ----------------------------------------------------------
rag:
  enabled: true
  chunk_size: 900
  chunk_overlap: 150
  top_k: 6
  min_score: 0.28
  index_dir: "./.deepseek/vectors"
  auto_index_workspace: true
  file_extensions: [".md", ".txt", ".py", ".js", ".ts", ".json", ".yaml", ".yml",
                    ".html", ".css", ".sh", ".java", ".c", ".cpp", ".go", ".rs", ".rb", ".php"]
  max_file_mb: 5

# ----------------------------------------------------------
# MEMORY
# ----------------------------------------------------------
memory:
  enabled: true
  db_path: "./.deepseek/memory.db"
  recent_window: 12
  semantic_top_k: 5
  save_task_summaries: true

# ----------------------------------------------------------
# SKILLS
# ----------------------------------------------------------
skills:
  dir: "./skills"
  progressive_disclosure: true   # sirf frontmatter load, body on-demand
  max_active_skills: 3

# ----------------------------------------------------------
# TOOLS
# ----------------------------------------------------------
tools:
  web_search:
    enabled: true
    engine: duckduckgo
    max_results: 6
  web_fetch:
    enabled: true
    max_chars: 12000
  shell:
    enabled: true
  python:
    enabled: true

# ----------------------------------------------------------
# KEY FAILOVER
# ----------------------------------------------------------
failover:
  notify_user: true              # tell the user when keys switch
  cooldown_seconds: 60           # rate-limited key ko itni der rest
  hard_fail_cooldown: 600        # invalid/quota key ka lamba cooldown
  max_key_rotations_per_call: 0   # 0 = no cap: EVERY added key participates in rotation
                                  # (ring waits ≤45s when all keys cool, then retries)
  retry_backoff_base: 1.5

ui:
  fancy_input: true              # `/` slash menu + history (DEEPSEEK_FANCY_INPUT=0 to disable)
