# ==========================================================
#  NEXUS AGENT - Main Configuration
#  Autonomous multi-agent CLI system (Termux friendly)
# ==========================================================

app:
  name: "DeepSeek-Agent"
  version: "2.0.0"
  workspace: "./workspace"          # agent ka sandbox / project directory
  data_dir: "./.nexus"              # db, vectors, logs, sessions
  theme: "cocoa"                    # cyber | mono | matrix
  language: "auto"                  # auto | en | hi  (agent reply language)

# ----------------------------------------------------------
# PROVIDERS  -> add new providers here (openai/groq/etc.)
# ----------------------------------------------------------
# Folder for API keys — the /key menu saves here (gitignored, chmod 600)
keys:
  dir: "./keys"

providers:
  default: deepseek

  deepseek:
    enabled: true
    type: deepseek                   # nexus/providers/deepseek.py
    # DeepSeek-Agent logs in with email+password -> bearer token
    # (saved to keys/deepseek_account.json + keys/deepseek_token, chmod 600).
    # Native app mode: instant | expert | vision  (switch at runtime with /mode)
    mode: expert
    thinking: true
    search: false
    keys_dir: "./keys"
    data_dir: "./.nexus"
    timeout: 180

  mistral:
    enabled: true
    type: mistral                    # nexus/providers/mistral.py (optional fallback)
    base_url: "https://api.mistral.ai/v1"
    # keys come from the environment: MISTRAL_API_KEY, MISTRAL_API_KEY_2 ... or keys.json
    env_keys: ["MISTRAL_API_KEY", "MISTRAL_API_KEY_2", "MISTRAL_API_KEY_3"]
    timeout: 180
    max_retries_per_key: 2

  openai:
    enabled: false
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    env_keys: ["OPENAI_API_KEY"]
    timeout: 180

  groq:
    enabled: false
    type: openai_compatible
    base_url: "https://api.groq.com/openai/v1"
    env_keys: ["GROQ_API_KEY"]
    timeout: 120

  ollama:
    enabled: false
    type: openai_compatible
    base_url: "http://127.0.0.1:11434/v1"
    env_keys: []
    api_key: "ollama"
    timeout: 300

# ----------------------------------------------------------
# MODEL ROLES  (role -> model + fallback chain)
# ----------------------------------------------------------
# Roles use the STRONGEST model that still has usable org quota
# (admin.mistral.ai 2026-08-26). 8 keys rotate on 429 — do NOT default
# to 8B/3B when medium-2508 has 356k tok/min vs medium-latest 25k.
# DeepSeek-Agent: every role runs on DeepSeek (native instant/expert/vision mode
# is chosen globally with `/mode`; the model name is a placeholder — DeepSeek
# uses its own web API and ignores it).
models:
  supervisor:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 4096
  router:
    model: deepseek-chat
    fallback: []
    temperature: 0.0
    max_tokens: 1024
  worker:
    model: deepseek-chat
    fallback: []
    temperature: 0.4
    max_tokens: 4096
  solo:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 8192
  researcher:
    model: deepseek-chat
    fallback: []
    temperature: 0.3
    max_tokens: 8192
  coder_quick:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  coder_repo:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  critic:
    model: deepseek-chat
    fallback: []
    temperature: 0.1
    max_tokens: 4096
  hard_fallback:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 8192
  embed:
    model: deepseek-chat
    fallback: []
  code_embed:
    model: deepseek-chat
    fallback: []
  ocr:
    model: deepseek-chat
    fallback: []
  safety:
    model: deepseek-chat
    fallback: []
  vision:
    model: deepseek-chat
    fallback: []
    temperature: 0.2
    max_tokens: 2048

# ----------------------------------------------------------
# RATE LIMITS  (requests per second per model)
# Matched to the ACTUAL organization limits (admin.mistral.ai > Limits):
#   ministral-3b-2512  12.50 rps | 1,500,000 tok/min
#   ministral-8b-2512   3.13 rps |   625,000 tok/min
#   ministral-14b-2512  0.50 rps |   937,500 tok/min
#   mistral-small-2603  0.83 rps |    50,000 tok/min
#   mistral-medium-latest   ~0.42 rps | 25,000 tok/min
#   codestral-2508      2.08 rps |   628,000 tok/min
#   devstral-2512       0.83 rps | 1,000,000 tok/min
#   mistral-large-2512  0.07 rps |   250,000 tok/min
#   mistral-embed-2312  1.00 rps | 20,000,000 tok/min
#   codestral-embed     1.00 rps |    50,000 tok/min
#   mistral-moderation-2603 ~1.00 rps | 50,000 tok/min
# Client paces to ~85% of these; a 429 pushes the model's next slot out.
# ----------------------------------------------------------
rate_limits:
  ministral-3b-2512: 10.0
  ministral-8b-2512: 3.0
  ministral-14b-2512: 0.45
  mistral-small-2603: 0.75
  mistral-medium-latest: 0.32
  mistral-medium-2505: 0.40
  mistral-medium-2508: 0.36
  mistral-medium-2604: 0.5
  voxtral-mini-2602: 1.4
  voxtral-small-2507: 0.95
  codestral-2508: 2.0
  devstral-2512: 0.8
  mistral-large-2512: 0.065
  mistral-embed-2312: 0.95
  codestral-embed: 0.95
  mistral-moderation-2603: 0.95
  pixtral-12b-2409: 0.8
  pixtral-large-2411: 0.4
  deepseek-chat: 0.8
  default: 1.5

# ----------------------------------------------------------
# AUTONOMY CONTROLS
# ----------------------------------------------------------
autonomy:
  max_subagents: 5
  max_parallel_agents: 3
  max_task_depth: 3
  max_steps_per_agent: 12
  max_retries: 2
  task_timeout_seconds: 180
  overall_timeout_seconds: 1500
  large_model_calls_per_task: 1
  max_devstral_parallel: 2
  auto_continue: true            # agent bina puche next step chalata rahe
  reflection_every: 4            # har N steps par self-reflection

# ----------------------------------------------------------
# SAFETY / APPROVALS
# ----------------------------------------------------------
safety:
  moderation_enabled: true
  moderate_user_input: true
  moderate_final_output: true
  approval_mode: "smart"        # smart | always | never(yolo)
  human_approval_required:
    - delete_files
    - deploy_production
    - send_email
    - publish_content
    - financial_action
    - account_change
    - shell_dangerous
  shell:
    allow_network: true
    blocked_patterns:
      - "rm -rf /"
      - "mkfs"
      - ":(){:|:&};:"
      - "dd if=/dev/zero"
      - "chmod -R 777 /"
      - "> /dev/sda"
    timeout: 120
  sandbox_root_only: true       # writes stay inside the workspace only

# ----------------------------------------------------------
# RAG
# ----------------------------------------------------------
rag:
  enabled: true
  chunk_size: 900
  chunk_overlap: 150
  top_k: 6
  min_score: 0.28
  index_dir: "./.nexus/vectors"
  auto_index_workspace: true
  file_extensions: [".md", ".txt", ".py", ".js", ".ts", ".json", ".yaml", ".yml",
                    ".html", ".css", ".sh", ".java", ".c", ".cpp", ".go", ".rs", ".rb", ".php"]
  max_file_mb: 5

# ----------------------------------------------------------
# MEMORY
# ----------------------------------------------------------
memory:
  enabled: true
  db_path: "./.nexus/memory.db"
  recent_window: 12
  semantic_top_k: 5
  save_task_summaries: true

# ----------------------------------------------------------
# SKILLS
# ----------------------------------------------------------
skills:
  dir: "./skills"
  progressive_disclosure: true   # sirf frontmatter load, body on-demand
  max_active_skills: 3

# ----------------------------------------------------------
# TOOLS
# ----------------------------------------------------------
tools:
  web_search:
    enabled: true
    engine: duckduckgo
    max_results: 6
  web_fetch:
    enabled: true
    max_chars: 12000
  shell:
    enabled: true
  python:
    enabled: true

# ----------------------------------------------------------
# KEY FAILOVER
# ----------------------------------------------------------
failover:
  notify_user: true              # tell the user when keys switch
  cooldown_seconds: 60           # rate-limited key ko itni der rest
  hard_fail_cooldown: 600        # invalid/quota key ka lamba cooldown
  max_key_rotations_per_call: 0   # 0 = no cap: EVERY added key participates in rotation
                                  # (ring waits ≤45s when all keys cool, then retries)
  retry_backoff_base: 1.5

ui:
  fancy_input: true              # `/` slash menu + history (NEXUS_FANCY_INPUT=0 to disable)
